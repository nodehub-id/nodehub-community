name: Bug Report
description: Report a bug or unexpected behavior in NodeHub Community Edition
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When I send a request to /v1/chat/completions with the Anthropic provider, the response...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Configure Anthropic provider with API key
        2. Send a chat completion request with model 'claude-sonnet'
        3. Observe the error in the response
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or logs if available.
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker Compose
        - Manual (Node.js + PostgreSQL)
        - Vercel + Neon
        - Fly.io
        - Other
    validations:
      required: true

  - type: dropdown
    id: embedding
    attributes:
      label: Embedding Provider
      options:
        - Ollama
        - Hugging Face TEI
        - Local Transformers (Xenova)
        - OpenAI
        - Other

  - type: input
    id: version
    attributes:
      label: NodeHub Version
      description: "Run `cat package.json | grep version` or check the dashboard footer"
      placeholder: "0.1.0"

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: "Run `node --version`"
      placeholder: "v20.11.0"

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Ubuntu 22.04 / macOS 14.3 / Windows 11"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output. This will be automatically formatted as code.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or configuration details.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues to make sure this isn't a duplicate
          required: true
        - label: I am using the latest version of NodeHub Community Edition
          required: false